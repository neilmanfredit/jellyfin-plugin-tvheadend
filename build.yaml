changelog: |-
  - Added a "Channels" section to the plugin settings page with two admin
    actions: "Rebuild channels" (forces a fresh HTSP connection so
    TVHeadend resends its channel list, then best-effort queues Jellyfin's
    own Live TV guide/channel refresh task) and "Clear channel logo cache"
    (force re-downloads all cached channel logos).
  - Ported to the Jellyfin 12.0 plugin ABI (net10.0, Jellyfin.Controller
    12.0.0-rc4). No source changes were required beyond retargeting, since
    the underlying MediaBrowser.* assemblies stayed source-compatible.
  - Forked and renamed to TvheadEndNew with a distinct plugin GUID so it can be
    installed alongside the official upstream TVHeadend plugin.
  - Jellyfin 10.11 support (#100) @crobibero
  - Restore subtitles and multiple audio that got destroyed in commit db8cd9af238813a7b141ba826168fdaa22f1509e on Feb 18, 2018 (#68) @roman-vanicek
  - Further Release 10.9.x improvements (#92) @lomion0815
  - Readme: update build requirements (#93) @citronalco
  - Fixed link to TVHeadend image (#83) @lomion0815
  - Set correct dates for recordings (#84) @lomion0815
  - Changed HTSP field "summary" to correct name "subtitle". (#85) @lomion0815
